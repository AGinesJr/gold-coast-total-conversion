name: Phase 0 Repository Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate task/toolchain/catalog metadata
        run: python scripts/validate_phase0.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
