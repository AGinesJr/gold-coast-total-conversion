name: Phase 0 Repository Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate task/toolchain/catalog metadata
        run: python scripts/validate_phase0.py
      - name: Build metadata-only REDmod scaffold
        run: python scripts/package_redmod.py build --source tests/fixtures/redmod_stub/GoldCoastPrototype --output build/GoldCoastPrototype.zip
      - name: Validate package and SHA-256
        run: python scripts/package_redmod.py validate --package build/GoldCoastPrototype.zip
      - name: Build metadata-only REDmod scaffold
        run: python scripts/package_redmod.py build --source tests/fixtures/redmod_stub/GoldCoastPrototype --output build/GoldCoastPrototype.zip
      - name: Validate package
        run: python scripts/package_redmod.py validate --package build/GoldCoastPrototype.zip
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Upload package proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: gold-coast-p0d-redmod-package-proof
          path: build/GoldCoastPrototype.zip*
          if-no-files-found: error
      - name: Upload package proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: gold-coast-p0d-redmod-package-proof
          path: |
            build/GoldCoastPrototype.zip
            build/GoldCoastPrototype.zip.sha256
          if-no-files-found: error
